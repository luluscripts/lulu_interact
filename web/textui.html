<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>lulu TextUI</title>
    <link rel="stylesheet" href="textui.css">
</head>

<body>
    <div id="textui-container">
        <div class="textui-item">
            <div class="textui-button">
                <div class="textui-decoration top-left"></div>
                <span class="textui-key">E</span>
            </div>
            <div class="textui-text">
                <div class="textui-decoration bottom-right"></div>
                <span class="textui-label">Open</span>
            </div>
        </div>
    </div>

    <script type="module" src="textui.js"></script>
</body>

</html>
