<html>

<head>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Plus+Jakarta+Sans:wght@600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free/css/all.min.css" />
  <link href="style.css" rel="stylesheet" type="text/css" />
</head>

<body>
  <div id="container">
    <div id="interact-container">
      <div id="interact-key">
        <div id="progress-fill-liquid"></div>
        <div id="interact-key-content"><span>E</span></div>
      </div>
    </div>

    <div id="options-wrapper">
      <div class="animated-background"></div>
      <div class="option-container">
        <i class="fas fa-hand-paper fa-fw option-icon"></i>
        <p class="option-label">Option 1</p>
      </div>

      <div class="option-container">
        <i class="fas fa-hand-paper fa-fw option-icon"></i>
        <p class="option-label">Option 2</p>
      </div>

      <div class="option-container">
        <i class="fas fa-hand-paper fa-fw option-icon"></i>
        <p class="option-label">Option 3 (hold)</p>
      </div>

      <div class="option-container">
        <i class="fas fa-hand-paper fa-fw option-icon"></i>
        <p class="option-label">Option 4</p>
      </div>

      <div class="option-container">
        <i class="fas fa-hand-paper fa-fw option-icon"></i>
        <p class="option-label">Option 5</p>
      </div>
    </div>
  </div>

  <script defer type="module" src="js/main.js"></script>
</body>

</html>
